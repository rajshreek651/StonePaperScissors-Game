<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games</title>
    <link rel="stylesheet" href="sps.css">
</head>
<body>
    <header>
        <h1>Stone Paper Scissors</h1>
    </header>

    <div class="choices">
        <div class="choice" id="stone"><div class="sps" style="background-image: url('spsPhotos/Stone_img.jpg');"></div></div>
        <div class="choice" id="paper"><div class="sps" style="background-image: url('spsPhotos/Paper_img.jpg');"></div></div>
        <div class="choice" id="scissors"><div class="sps" style="background-image: url('spsPhotos/Scissors_img.jpg');"></div></div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="comp-score">0</p>
            <p>Comp</p>
        </div>
    </div>
    
    <div class="msg-container">
        <span class="msg">Play your move!</span>
    </div>

    <footer>
        <div class="foot-links" style="margin: 10px 0px 10px 0px">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Policy</a>
            <a href="#">Gaming & Fantasy</a>
            <a href="#">Help</a>
        </div>
        <div class="foot-mssg">made with &hearts; by @techWorld.in</div>
        <div style="margin-bottom: 10px;">© innovated from ApnaCollege</div>
    </footer>
    <script src="sps.js"></script>
</body>
</html>
